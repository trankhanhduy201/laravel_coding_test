[PHP]
; Minimal overrides for containerized app
date.timezone = UTC
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M
max_execution_time = 300
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Enable short tags if needed
short_open_tag = Off

; Recommended for production
expose_php = Off

; Realpath cache size
realpath_cache_size = 4096k
realpath_cache_ttl = 120
